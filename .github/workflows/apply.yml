name: apply

on:
  workflow_dispatch:
    inputs:
      facility_id:
        description: Facility id from TARGETS_JSON
        required: true
        type: string
      stay_date:
        description: Stay start date (YYYY-MM-DD)
        required: true
        type: string
      nights:
        description: Nights
        required: true
        type: choice
        options: ["1", "2"]
      persons:
        description: Total guests
        required: true
        type: string
      room_persons:
        description: Guests in the single room (must equal total guests)
        required: true
        type: string
      room_number:
        description: Preferred room number (blank selects the highest capacity, then the lowest room number)
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: operation-main
  cancel-in-progress: false

jobs:
  reserve:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create targets.json
        env:
          TARGETS_JSON: ${{ secrets.TARGETS_JSON }}
        run: |
          if [ -z "$TARGETS_JSON" ]; then echo "TARGETS_JSON secret is required" >&2; exit 1; fi
          printf '%s' "$TARGETS_JSON" > targets.json
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run manual operation
        env:
          BOOKING_ORIGIN: ${{ secrets.BOOKING_ORIGIN }}
          BOOKING_BRANCH: main
          BOOKING_GITHUB_TOKEN: ${{ github.token }}
          BOOKING_EMAIL: ${{ secrets.BOOKING_EMAIL }}
          FACILITY_ID: ${{ inputs.facility_id }}
          STAY_DATE: ${{ inputs.stay_date }}
          NIGHTS: ${{ inputs.nights }}
          PERSONS: ${{ inputs.persons }}
          ROOM_PERSONS: ${{ inputs.room_persons }}
          ROOM_NUMBER: ${{ inputs.room_number }}
        run: |
          if [ -z "$BOOKING_EMAIL" ]; then echo "BOOKING_EMAIL secret is required" >&2; exit 1; fi
          args=(--facility-id "$FACILITY_ID" --date "$STAY_DATE" --nights "$NIGHTS" --persons "$PERSONS" --rooms 1 --room-persons "$ROOM_PERSONS")
          if [ -n "$ROOM_NUMBER" ]; then args+=(--room-number "$ROOM_NUMBER"); fi
          python apply_booking.py "${args[@]}"
