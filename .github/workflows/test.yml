name: test

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: test
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Create targets.json
        env:
          TARGETS_JSON: ${{ secrets.TARGETS_JSON }}
        run: |
          printf '%s' "$TARGETS_JSON" > targets.json

      - run: pip install -r requirements.txt

      - name: Check availability and notify
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          COMMON_CALENDAR_URL: ${{ secrets.COMMON_CALENDAR_URL }}
        run: python watch.py

      - name: Persist state
        if: always()
        run: |
          if [ -f state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git diff --cached --quiet || (
              git commit -m "Update test state" &&
              git push
            )
          fi

