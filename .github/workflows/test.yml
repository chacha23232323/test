name: test

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: operation-main
  cancel-in-progress: false

jobs:
  test:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 70

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create targets.json
        env:
          TARGETS_JSON: ${{ secrets.TARGETS_JSON }}
        run: |
          printf '%s' "$TARGETS_JSON" > targets.json

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false

      - name: Install dependencies
        run: uv pip install --system -r requirements.txt

      - name: Run configured checks
        id: watch
        env:
          BOOKING_DEFER_LEDGER_WRITE: "true"
          BOOKING_ORIGIN: ${{ secrets.BOOKING_ORIGIN }}
          BOOKING_BRANCH: main
          BOOKING_GITHUB_TOKEN: ${{ github.token }}
          BOOKING_MAIL_SENDER: ${{ secrets.BOOKING_MAIL_SENDER }}
          RESERVATION_SYNC_URL: ${{ secrets.RESERVATION_SYNC_URL }}
          BOOKING_GMAIL_OAUTH: ${{ secrets.BOOKING_GMAIL_OAUTH }}
          RESERVATION_SYNC_SECRET: ${{ secrets.RESERVATION_SYNC_SECRET }}
          BOOKING_APPLICANT: ${{ secrets.BOOKING_APPLICANT }}
          BOOKING_EMAIL: ${{ secrets.BOOKING_EMAIL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          COMMON_CALENDAR_URL: ${{ secrets.COMMON_CALENDAR_URL }}
        run: python watch.py --hourly

      - name: Persist state
        if: always() && steps.watch.outcome != 'skipped'
        run: |
          if [ -f state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add state.json

            if ! git diff --cached --quiet; then
              git commit -m "Update test state"
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi