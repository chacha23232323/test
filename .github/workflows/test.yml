
name: test

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: test
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    env:
      UV_CACHE_DIR: ${{ runner.temp }}/uv-cache

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # uv本体をキャッシュ
      - name: Cache uv binary
        id: uv-binary-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/uv
          key: uv-${{ runner.os }}-${{ runner.arch }}-0.13.8

      # キャッシュがなければuvをインストール
      - name: Install uv
        if: steps.uv-binary-cache.outputs.cache-hit != 'true'
        run: |
          curl -LsSf https://astral.sh/uv/0.13.8/install.sh | sh

      - name: Add uv to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Pythonパッケージのキャッシュ
      - name: Cache Python packages
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/uv-cache
          key: uv-packages-${{ runner.os }}-${{ runner.arch }}-py312-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            uv-packages-${{ runner.os }}-${{ runner.arch }}-py312-

      - name: Create targets.json
        env:
          TARGETS_JSON: ${{ secrets.TARGETS_JSON }}
        run: |
          printf '%s' "$TARGETS_JSON" > targets.json

      - name: Install dependencies
        run: uv pip install --system -r requirements.txt

      - name: Check availability and notify
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          COMMON_CALENDAR_URL: ${{ secrets.COMMON_CALENDAR_URL }}
        run: python watch.py

      - name: Persist state
        if: always()
        run: |
          if [ -f state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add state.json

            if ! git diff --cached --quiet; then
              git commit -m "Update test state"
              git pull --rebase origin main
              git push
            fi
          fi