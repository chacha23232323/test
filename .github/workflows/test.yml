
name: test

on:
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'

permissions:
  contents: write

concurrency:
  group: its-kenpo-main
  cancel-in-progress: false

jobs:
  test:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || vars.AUTO_BOOKING_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create targets.json
        env:
          TARGETS_JSON: ${{ secrets.TARGETS_JSON }}
        run: |
          printf '%s' "$TARGETS_JSON" > targets.json

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false

      - name: Install dependencies
        run: uv pip install --system -r requirements.txt

      - name: Check availability, notify and apply if enabled
        id: watch
        env:
          BOOKING_BRANCH: main
          BOOKING_GITHUB_TOKEN: ${{ github.token }}
          AUTO_BOOKING_ENABLED: ${{ vars.AUTO_BOOKING_ENABLED }}
          BOOKING_EMAIL: ${{ secrets.BOOKING_EMAIL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          COMMON_CALENDAR_URL: ${{ secrets.COMMON_CALENDAR_URL }}
        run: python watch.py

      - name: Persist state
        if: always() && steps.watch.outcome != 'skipped'
        run: |
          if [ -f state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add state.json

            if ! git diff --cached --quiet; then
              git commit -m "Update test state"
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi
